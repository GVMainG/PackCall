services:
  packcall.worker:
    depends_on:
      packcall.test-email-operator:
        condition: service_healthy
  packcall.test-email-operator:
    image: ${DOCKER_REGISTRY?DOCKER_REGISTRY must be set (empty allowed)}packcalltestemailoperator
    build:
      context: ./src/PackCall.TestEmailOperator
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 40s
