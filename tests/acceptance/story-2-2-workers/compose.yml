services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: acceptance
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance
    ports: ["127.0.0.1::5432"]
    volumes: ["data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d acceptance"]
      interval: 1s
      retries: 40
  migrator:
    build: {context: ../../.., dockerfile: src/PackCall.Migrator/Dockerfile}
    environment: &connection
      PACKCALL_ENVIRONMENT: ${PACKCALL_ENVIRONMENT:?}
      TEST_SENDER_MODE: ${TEST_SENDER_MODE:?}
      TEST_OPERATOR_URL: ${TEST_OPERATOR_URL-}
      TEST_SIMULATE_ERRORS: ${TEST_SIMULATE_ERRORS:-false}
      ConnectionStrings__Postgres: Host=db;Database=acceptance;Username=acceptance;Password=acceptance
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ../../.., dockerfile: src/PackCall.Api/Dockerfile}
    environment:
      <<: *connection
      ASPNETCORE_HTTP_PORTS: 8080
    ports: ["127.0.0.1::8080"]
    depends_on: {migrator: {condition: service_completed_successfully}}
  probe:
    image: ${COMPOSE_PROJECT_NAME}-probe
    build: {context: ../../.., dockerfile: tests/acceptance/story-2-2-workers/Dockerfile}
    environment: *connection
    volumes: ["${W22_CONTROL}:/control"]
    profiles: ["tools"]
  operator:
    image: packcalltestemailoperator
    build: {context: ../../../src/PackCall.TestEmailOperator}
    read_only: true
    profiles: ["http"]
volumes:
  data:

