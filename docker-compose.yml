services:
  packcall.api:
    image: ${DOCKER_REGISTRY?DOCKER_REGISTRY must be set (empty allowed)}packcallapi
    build:
      context: .
      dockerfile: src/PackCall.Api/Dockerfile
    environment: &packcall-environment
      PACKCALL_ENVIRONMENT: ${PACKCALL_ENVIRONMENT:?PACKCALL_ENVIRONMENT must be set}
      TEST_SENDER_MODE: ${TEST_SENDER_MODE:?TEST_SENDER_MODE must be set}
      TEST_SIMULATE_ERRORS: ${TEST_SIMULATE_ERRORS:?TEST_SIMULATE_ERRORS must be set}
      TEST_OPERATOR_URL: ${TEST_OPERATOR_URL?TEST_OPERATOR_URL must be set (empty allowed for inprocess)}
      TEST_OPERATOR_TIMEOUT_SECONDS: ${TEST_OPERATOR_TIMEOUT_SECONDS:?TEST_OPERATOR_TIMEOUT_SECONDS must be set}
      ConnectionStrings__Postgres: Host=packcall.db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB must be set};Username=${POSTGRES_USER:?POSTGRES_USER must be set};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on:
      packcall.migrator:
        condition: service_completed_successfully
    stop_grace_period: 40s

  packcall.worker:
    image: ${DOCKER_REGISTRY?DOCKER_REGISTRY must be set (empty allowed)}packcallworker
    build:
      context: .
      dockerfile: src/PackCall.Worker/Dockerfile
    environment:
      <<: *packcall-environment
    depends_on:
      packcall.migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 40s

  packcall.migrator:
    image: ${DOCKER_REGISTRY?DOCKER_REGISTRY must be set (empty allowed)}packcallmigrator
    build:
      context: .
      dockerfile: src/PackCall.Migrator/Dockerfile
    environment:
      <<: *packcall-environment
    depends_on:
      packcall.db:
        condition: service_healthy
    restart: "no"

  packcall.db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - packcall-postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  packcall-postgres-data:
