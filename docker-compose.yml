services:
  packcall.api:
    image: ${DOCKER_REGISTRY-}packcallapi
    build:
      context: .
      dockerfile: src/PackCall.Api/Dockerfile
    environment: &packcall-environment
      ConnectionStrings__Postgres: Host=packcall.db;Port=5432;Database=${POSTGRES_DB:-packcall};Username=${POSTGRES_USER:-packcall};Password=${POSTGRES_PASSWORD:-packcall}
    depends_on:
      packcall.migrator:
        condition: service_completed_successfully
    stop_grace_period: 40s

  packcall.worker:
    image: ${DOCKER_REGISTRY-}packcallworker
    build:
      context: .
      dockerfile: src/PackCall.Worker/Dockerfile
    environment:
      <<: *packcall-environment
    depends_on:
      packcall.migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 40s

  packcall.migrator:
    image: ${DOCKER_REGISTRY-}packcallmigrator
    build:
      context: .
      dockerfile: src/PackCall.Migrator/Dockerfile
    environment:
      <<: *packcall-environment
    depends_on:
      packcall.db:
        condition: service_healthy
    restart: "no"

  packcall.db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-packcall}
      POSTGRES_USER: ${POSTGRES_USER:-packcall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-packcall}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - packcall-postgres-data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  packcall-postgres-data:
